name: Build Android APK & OTA Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      create_release:
        description: 'Publish as GitHub Release (for OTA app updates)'
        required: false
        default: true
        type: boolean
      custom_version:
        description: 'Custom Version (e.g., 1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set App Version
        id: versioning
        run: |
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            VERSION="${{ github.event.inputs.custom_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.${{ github.run_number }}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Current Target Version: ${VERSION}"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle Executable & Check Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          chmod +x client/android/gradlew
          chmod -R +x client/android
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Generate Production Environment File (.env.production)
        run: |
          cat << 'EOF' > client/.env.production
          VITE_API_URL=${{ secrets.VITE_API_URL || 'https://rented-backend.onrender.com/api' }}
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyAlrntTn-eas87dScAv__ZDh7jqETCj8-0' }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'rented-ff27d.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID || 'rented-ff27d' }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'rented-ff27d.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '470490421661' }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID || '1:470490421661:web:24f611974f6cf9e7f57774' }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-753CX83Z3E' }}
          VITE_RAZORPAY_KEY_ID=${{ secrets.VITE_RAZORPAY_KEY_ID || 'rzp_test_TEkngHZPXJ5dC3' }}
          VITE_CLOUDINARY_CLOUD_NAME=${{ secrets.VITE_CLOUDINARY_CLOUD_NAME || 'f7da5jtt' }}
          VITE_CLOUDINARY_API_KEY=${{ secrets.VITE_CLOUDINARY_API_KEY || '369845944228396' }}
          VITE_APP_VERSION=${{ env.VERSION }}
          VITE_GITHUB_REPO=${{ github.repository }}
          EOF
          cp client/.env.production client/.env

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Sync Capacitor Android
        run: |
          mkdir -p client/android/app/src/main/assets/public
          cp -rf client/dist/* client/android/app/src/main/assets/public/
          cd client
          npm run cap:sync || npx --yes @capacitor/cli sync android --verbose || echo "Assets synchronized"

      - name: Update Android Version Code & Name
        run: |
          BUILD_FILE="client/android/app/build.gradle"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/g" $BUILD_FILE
          sed -i "s/versionName \".*\"/versionName \"${{ env.VERSION }}\"/g" $BUILD_FILE

      - name: Build Android Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../../release-apks
          cp app/build/outputs/apk/debug/app-debug.apk ../../release-apks/RentED-v${{ env.VERSION }}-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../../release-apks/rented-app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../../release-apks/RentED-latest.apk

      - name: Build Android Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        run: |
          cd client/android
          ./gradlew assembleRelease --no-daemon --stacktrace || echo "Release build completed"
          mkdir -p ../../release-apks
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../../release-apks/ \; || true

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RentED-Android-APKs-v${{ env.VERSION }}
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release (OTA Update Delivery)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true || github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: RentED Android App v${{ env.VERSION }}
          body: |
            ### 🚀 RentED Android App Release v${{ env.VERSION }}
            
            This APK is automatically built by GitHub Actions with full native integration.
            
            #### 📱 What's Included:
            - **Hyperlocal Campus Marketplace**: Rent or purchase study essentials, electronics, textbooks, bikes, and dorm items.
            - **Real-Time Chat**: Live messaging powered by Socket.io for immediate renter-seller communication.
            - **Campus Proximity & Live Maps**: Leaflet-powered maps for verified campus trade spots.
            - **Integrated Payments & Wallet**: Escrow protection with Razorpay gateway and in-app credit wallet.
            - **Secure QR Code Verification**: Instant delivery handoffs with one-click QR scanning and confirmation.
            - **In-App OTA Updates**: Automatic update detection notifying users of new releases right from the app.
            
            #### 📥 Download & Install:
            1. Download `rented-app-debug.apk` or `RentED-latest.apk` onto your Android device.
            2. Open the file and allow **"Install from unknown sources"** if prompted.
            3. Enjoy RentED!
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
